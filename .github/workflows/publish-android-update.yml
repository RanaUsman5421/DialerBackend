name: Publish Android update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-android-update.yml'
      - 'scripts/verifyAndroidRelease.mjs'
      - 'updates/android/updater.json'
      - 'updates/android/lionexphone-*.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK metadata and checksum
        run: node scripts/verifyAndroidRelease.mjs "$GITHUB_REPOSITORY"
      - name: Create public GitHub Release with APK asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./updates/android/updater.json').versionName")
          TAG="android-v${VERSION}"
          APK="updates/android/lionexphone-${VERSION}.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Use a new version for a new APK."
            exit 1
          fi
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LionexPhone ${VERSION}" \
            --notes "$(node -p "require('./updates/android/updater.json').notes")"
